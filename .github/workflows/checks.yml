name: CI

on:
  push:
    branches:
      - main
    paths-ignore:
      - "**/*.md"
      - "web/**"
  pull_request:
    paths-ignore:
      - "**/*.md"
      - "web/**"

permissions:
  contents: read
  pull-requests: read

jobs:
  golangci:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          # v2.12.2 is built with go1.26, so it can lint this go 1.26 module.
          version: v2.12.2

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - name: Fetch Repository
        uses: actions/checkout@v5

      - name: Install Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      # Formatting, vet and the tests, the end-to-end ones included.
      - name: Check
        run: make check
